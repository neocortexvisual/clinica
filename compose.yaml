name: clinica

services:
  chatbot:
    build:
      context: "./app/lib/repositorios/paciente atendimento virtual/backend do chatbot"
    ports:
      - "${CHATBOT_BIND:-127.0.0.1}:${CHATBOT_PORT:-8000}:8000"
    environment:
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
    init: true
    restart: unless-stopped
